<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wininfopanel</title>
<style>
/*
 * Every colour is a custom property. Adding a light or custom theme later is
 * then a matter of redefining this block under another [data-theme] selector,
 * not touching any rule below it.
 */
:root {
  --bg:            #14161c;
  --bg-raised:     #1a1e27;
  --bg-inset:      #101219;
  --border:        #2e3646;
  --border-subtle: #232833;

  --text:          #eaeaf0;
  --text-muted:    #9aa4b8;
  --text-faint:    #6b7280;

  --accent:        #5ac8fa;
  --accent-warm:   #ff9f5a;
  --ok:            #7ed957;
  --bad:           #ff6b6b;

  --radius: 10px;
  --gap: 16px;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
}

header {
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: 14px 24px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-raised);
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

header .version {
  color: var(--text-faint);
  font-family: var(--mono);
  font-size: 12px;
}

header .spacer { flex: 1; }

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  gap: 24px;
}

section {
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow: hidden;
}

section > h2 {
  margin: 0;
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
}

section > .body { padding: 16px; }

.sources { display: grid; gap: 10px; }

.source {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-inset);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  background: var(--text-faint);
}
.dot.on  { background: var(--ok); }
.dot.off { background: var(--bad); }

.source .name { font-weight: 600; }
.source .detail { color: var(--text-muted); font-size: 13px; }
.source .count { margin-left: auto; color: var(--text-faint); font-family: var(--mono); font-size: 12px; }

.panels { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

.panel { display: grid; gap: 8px; }

.panel .label {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.panel .label .name { font-weight: 600; }
.panel .label .size { color: var(--text-faint); font-family: var(--mono); font-size: 12px; }

.panel img {
  width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-inset);
}

.empty {
  color: var(--text-muted);
  padding: 24px 16px;
  text-align: center;
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-subtle); }
th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
td.num { font-family: var(--mono); text-align: right; }
tbody tr:last-child td { border-bottom: none; }

.group-name { color: var(--accent); font-weight: 600; }

.toolbar { display: flex; gap: 8px; align-items: center; }

select, button {
  font: inherit;
  color: var(--text);
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px 10px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }

footer {
  padding: 20px 24px 40px;
  text-align: center;
  color: var(--text-faint);
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <h1>wininfopanel</h1>
  <span class="version" id="version"></span>
  <span class="spacer"></span>
  <span class="version" id="uptime"></span>
</header>

<main>
  <section>
    <h2>Data sources</h2>
    <div class="body"><div class="sources" id="sources"></div></div>
  </section>

  <section>
    <h2>Panels</h2>
    <div class="body"><div class="panels" id="panels"></div></div>
  </section>

  <section>
    <h2>Sensors</h2>
    <div class="body">
      <div class="toolbar">
        <select id="sensor-source"></select>
        <button id="sensor-refresh">Refresh</button>
      </div>
    </div>
    <div id="sensors"></div>
  </section>
</main>

<footer>wininfopanel &mdash; a Go port of InfoPanel</footer>

<script>
"use strict";

// The page polls rather than holding a socket open: a panel view is read-only,
// and polling survives sleep, network changes, and the server restarting
// without any reconnection logic.
const REFRESH_MS = window.__refreshMs || 1000;

async function getJSON(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`${path}: ${response.status} ${response.statusText}`);
  }
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function refreshStatus() {
  let status;
  try {
    status = await getJSON("/api/status");
  } catch (err) {
    document.getElementById("uptime").textContent = "disconnected";
    return;
  }

  document.getElementById("version").textContent = status.version;
  document.getElementById("uptime").textContent = `up ${status.uptime}`;

  const container = document.getElementById("sources");
  container.replaceChildren();

  if (!status.sources || status.sources.length === 0) {
    container.append(el("div", "empty", "No sensor sources are enabled."));
    return;
  }

  for (const source of status.sources) {
    const row = el("div", "source");
    row.append(el("span", `dot ${source.available ? "on" : "off"}`));
    row.append(el("span", "name", source.name));
    if (source.detail) row.append(el("span", "detail", source.detail));
    row.append(el("span", "count", `${source.sensorCount} sensors`));
    container.append(row);
  }
}

// Panel images are refreshed by moving a cache-busting parameter rather than
// rebuilding the element, so the browser swaps the picture without the layout
// flashing.
let panelNodes = new Map();

async function refreshPanels() {
  let profiles;
  try {
    profiles = await getJSON("/api/profiles");
  } catch {
    return;
  }

  const container = document.getElementById("panels");

  if (!profiles || profiles.length === 0) {
    container.replaceChildren(el("div", "empty", "No profiles yet."));
    panelNodes = new Map();
    return;
  }

  const seen = new Set();
  for (const profile of profiles) {
    seen.add(profile.id);

    let node = panelNodes.get(profile.id);
    if (!node) {
      const wrapper = el("div", "panel");
      const label = el("div", "label");
      label.append(el("span", "name", profile.name));
      label.append(el("span", "size", `${profile.width}x${profile.height}`));

      const img = document.createElement("img");
      img.alt = profile.name;
      img.loading = "lazy";

      wrapper.append(label, img);
      container.append(wrapper);

      node = { wrapper, img, name: label.firstChild, size: label.lastChild };
      panelNodes.set(profile.id, node);
    }

    node.name.textContent = profile.name;
    node.size.textContent = `${profile.width}x${profile.height}`;
    node.img.src = `/panel/${profile.id}/image.png?t=${Date.now()}`;
  }

  for (const [id, node] of panelNodes) {
    if (!seen.has(id)) {
      node.wrapper.remove();
      panelNodes.delete(id);
    }
  }
}

async function refreshSensorSources() {
  const select = document.getElementById("sensor-source");
  let status;
  try {
    status = await getJSON("/api/status");
  } catch {
    return;
  }

  const wanted = (status.sources || []).map((s) => s.source);
  const current = Array.from(select.options).map((o) => o.value);
  if (wanted.join() === current.join()) return;

  const previous = select.value;
  select.replaceChildren();
  for (const source of status.sources || []) {
    const option = document.createElement("option");
    option.value = source.source;
    option.textContent = source.name;
    select.append(option);
  }
  if (wanted.includes(previous)) select.value = previous;
}

async function refreshSensors() {
  const source = document.getElementById("sensor-source").value;
  const container = document.getElementById("sensors");

  if (!source) {
    container.replaceChildren(el("div", "empty", "No sensor source selected."));
    return;
  }

  let groups;
  try {
    groups = await getJSON(`/api/sensors/${source}`);
  } catch (err) {
    container.replaceChildren(el("div", "empty", String(err.message)));
    return;
  }

  if (!groups || groups.length === 0) {
    container.replaceChildren(el("div", "empty", "This source is reporting no sensors yet."));
    return;
  }

  const table = el("table");
  const head = el("thead");
  const headRow = el("tr");
  for (const [text, cls] of [["Sensor", ""], ["Type", ""], ["Value", "num"], ["Min", "num"], ["Max", "num"], ["Avg", "num"]]) {
    const th = el("th", cls, text);
    head.append(th);
    headRow.append(th);
  }
  head.replaceChildren(headRow);
  table.append(head);

  const body = el("tbody");
  for (const group of groups) {
    const groupRow = el("tr");
    const groupCell = el("td", "group-name", group.group);
    groupCell.colSpan = 6;
    groupRow.append(groupCell);
    body.append(groupRow);

    for (const sensor of group.sensors) {
      const row = el("tr");
      row.append(el("td", "", sensor.name));
      row.append(el("td", "", sensor.type));
      row.append(el("td", "num", sensor.text ? sensor.text : `${sensor.value.toFixed(2)}${sensor.unit}`));
      row.append(el("td", "num", sensor.text ? "-" : sensor.min.toFixed(2)));
      row.append(el("td", "num", sensor.text ? "-" : sensor.max.toFixed(2)));
      row.append(el("td", "num", sensor.text ? "-" : sensor.avg.toFixed(2)));
      body.append(row);
    }
  }
  table.append(body);
  container.replaceChildren(table);
}

document.getElementById("sensor-refresh").addEventListener("click", refreshSensors);
document.getElementById("sensor-source").addEventListener("change", refreshSensors);

async function tick() {
  await Promise.all([refreshStatus(), refreshPanels()]);
}

(async function start() {
  await refreshSensorSources();
  await refreshSensors();
  await tick();
  setInterval(tick, REFRESH_MS);
  // Sensors change less urgently than panel frames and the table is expensive
  // to rebuild, so it refreshes on its own slower cadence.
  setInterval(refreshSensors, 5000);
})();
</script>

</body>
</html>
